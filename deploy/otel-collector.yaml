# Receives OTLP from the app and the gateway. It only logs a summary as shipped: add your
# backend (Langfuse, Grafana Tempo, Honeycomb, Datadog, ...) as an exporter and list it below.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
exporters:
  debug: { verbosity: basic }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }
