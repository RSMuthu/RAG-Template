name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:  # lint, types, spec, offline tests, conformance and eval gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-extras --frozen
      - run: make check

  integration:  # the store contract against real Qdrant and pgvector
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -q -m integration

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-service .
