[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-template"
version = "0.1.0"
description = "A production-grade RAG service template, governed by HarnessWeaver."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "harnessweaver[openai,otel]>=0.18,<0.19",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "httpx>=0.28",
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12"]
pgvector = ["asyncpg>=0.30"]
docx = ["python-docx>=1.1"]

[project.scripts]
rag = "app.cli:main"

[dependency-groups]
dev = [
    "harnessweaver-cli>=0.7.1,<0.8",
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration and not stack"]
markers = [
    "integration: needs running Qdrant and Postgres (docker compose); run with -m integration",
    "stack: needs a running stack with the sample documents indexed; run with -m stack",
]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]  # the formatter owns line length; long strings and SQL may run over

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
